name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    name: API 鏋勫缓涓庢祴璇?    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: 瀹夎渚濊禆
        run: pnpm install --frozen-lockfile=false

      - name: 绫诲瀷妫€鏌ヤ笌娴嬭瘯
        working-directory: apps/api
        run: |
          pnpm exec tsc -p tsconfig.json --noEmit
          pnpm test

      - name: 鏋勫缓 API
        working-directory: apps/api
        run: pnpm build

  web:
    name: Web 鏋勫缓
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: 瀹夎渚濊禆
        run: pnpm install --frozen-lockfile=false

      - name: 鏋勫缓鍓嶇
        working-directory: apps/web
        run: pnpm build

