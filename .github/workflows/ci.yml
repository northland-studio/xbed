name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    name: API 构建与测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile=false

      - name: 类型检查与测试
        working-directory: apps/api
        run: |
          pnpm exec tsc -p tsconfig.json --noEmit
          pnpm test

      - name: 构建 API
        working-directory: apps/api
        run: pnpm build

  web:
    name: Web 构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile=false

      - name: 构建前端
        working-directory: apps/web
        run: pnpm build
