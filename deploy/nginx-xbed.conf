# XBed nginx 站点配置（放到 /etc/nginx/sites-available/xbed.xuanjian.top 并软链到 sites-enabled）
# 与官网 xuanjian.top 配置完全独立，不改动官网站点文件。

server {
    listen 80;
    listen [::]:80;
    server_name xbed.xuanjian.top;
    # certbot 会改写为 301 到 https
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name xbed.xuanjian.top;

    ssl_certificate     /etc/letsencrypt/live/xbed.xuanjian.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/xbed.xuanjian.top/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:xbed_ssl:10m;

    client_max_body_size 320m;   # .mcpr 上限 300MB + multipart 开销

    # 安全头
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    # 前端静态资源（Vite 构建产物）
    root /var/www/xbed/web;
    index index.html;

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:3939;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        client_max_body_size 320m;
        # 大文件上传不要缓冲到磁盘
        proxy_request_buffering off;
    }

    # 前端路由回退（SPA）
    location / {
        try_files $uri $uri/ /index.html;
    }

    access_log /var/www/xbed/logs/nginx-access.log;
    error_log  /var/www/xbed/logs/nginx-error.log warn;
}
